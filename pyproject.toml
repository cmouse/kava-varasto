[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kava-varasto"
version = "0.1.15"
description = "Storage bookkeeping system for Karhunvartijat ry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "Django>=5.2,<5.3",
    "django-environ>=0.11,<0.15",
    "gunicorn>=22,<27",
    "djangorestframework>=3.15,<3.19",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.15,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kava_varasto.settings.dev"
python_files = ["tests.py", "test_*.py"]
testpaths = ["src", "tests"]

[tool.ruff]
target-version = "py311"

# Ruff's implicit default rule set widens between releases, so leaving it
# implicit means an unrelated release turns CI red. Name the rules instead;
# the version cap above bounds what a new release can add inside the groups
# selected by prefix.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (ruff's own defaults)
    "F",               # pyflakes
    "I",               # import sorting
    "DTZ",             # naive datetimes -- this app runs with USE_TZ
    "EXE",             # shebang vs. executable bit
    # Picked individually: the RUF group as a whole is mostly style, and
    # RUF012 in particular fires on every Django declarative class
    # attribute (list_display, Meta.fields, ...), which are plain lists by
    # convention rather than ClassVar-annotated.
    "RUF005",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# Django generates migrations with unsorted imports, and they are not worth
# hand-editing after every makemigrations.
"**/migrations/*.py" = ["I001"]
