name: Deploy over SSH
description: >-
  Rsync the working tree to a host and restart the service, which builds and
  migrates on start.

inputs:
  host:
    description: Target hostname.
    required: true
  user:
    description: SSH user on the target.
    required: true
  ssh_key:
    description: Private SSH key authorised for that user.
    required: true
  path:
    description: >-
      Install directory on the host. Required and checked for emptiness: an
      empty value would make rsync write to the user's home root.
    required: true
  environment:
    description: >-
      Deploy environment name; selects the templated unit instance
      varasto@<environment>.
    required: true

runs:
  using: composite
  steps:
    - name: Check deploy configuration is set
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_KEY: ${{ inputs.ssh_key }}
        DEPLOY_PATH: ${{ inputs.path }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_KEY DEPLOY_ENVIRONMENT; do
          if [ -z "${!name}" ]; then
            echo "$name is empty: set the HOST, USER and INSTALL_PATH" >&2
            echo "variables and the SSH_KEY secret on this environment," >&2
            echo "and pass the environment name to the action." >&2
            exit 1
          fi
        done

        # rsync's remote path is expanded by a shell and a tilde works
        # there, but the remote script reads the path from a quoted
        # variable where it stays literal -- the upload would land in the
        # right place and the deploy would then fail on cd. Reject it up
        # front: both ends start in the deploy user's home, so the path
        # after the tilde already works on its own.
        case "$DEPLOY_PATH" in
          "~"*) echo "INSTALL_PATH must not start with ~: use ${DEPLOY_PATH#\~/} or an absolute path." >&2
                exit 1 ;;
        esac

    - name: Configure SSH
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_KEY: ${{ inputs.ssh_key }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

    # No --delete: the excludes would protect the receiver, but one mistake in
    # that list takes out varasto.sqlite3, .env or media/ irrecoverably. The
    # cost of leaving it off is stale build output, which start.sh rebuilds.
    - name: Upload files
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
      run: |
        rsync -az \
          -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
          --exclude '.git/' \
          --exclude '.github/' \
          --exclude '.venv/' \
          --exclude 'frontend/node_modules/' \
          --exclude '__pycache__/' \
          --exclude '*.egg-info/' \
          --exclude '.pytest_cache/' \
          --exclude '.ruff_cache/' \
          --exclude 'staticfiles/' \
          --exclude 'media/' \
          --exclude '.env' \
          --exclude '*.sqlite3' \
          --exclude '*.sqlite3-*' \
          ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

    # The unit runs start.sh, which builds the frontend, migrates, collects
    # static files and compiles translations before exec'ing gunicorn -- so
    # a restart is the whole deploy, and the environment it needs comes from
    # the unit rather than from this session.
    - name: Restart service
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
          "$DEPLOY_USER@$DEPLOY_HOST" \
          "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_ENVIRONMENT='$DEPLOY_ENVIRONMENT' bash -s" <<'REMOTE'
        set -eu

        # systemctl --user over a non-login SSH channel finds neither the
        # runtime directory nor the session bus on its own.
        XDG_RUNTIME_DIR="/run/user/$(id -u)"
        DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
        export XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS

        cd "$DEPLOY_PATH"

        # start.sh migrates on every start and migrations do not roll back,
        # so take a copy first. sqlite3's backup API is WAL-safe, cp is not.
        if [ -f varasto.sqlite3 ]; then
          python3 - <<'BACKUP'
        import sqlite3
        import time

        name = "varasto.sqlite3.backup-" + time.strftime("%Y%m%d%H%M%S")
        src = sqlite3.connect("varasto.sqlite3")
        dst = sqlite3.connect(name)
        with dst:
            src.backup(dst)
        dst.close()
        src.close()
        print("backed up database to " + name)
        BACKUP
        fi

        unit="varasto@$DEPLOY_ENVIRONMENT"
        systemctl --user restart "$unit"
        # status exits non-zero for a merely inactive unit, so log it and let
        # is-active decide whether the deploy succeeded.
        systemctl --user --no-pager status "$unit" || true
        systemctl --user is-active --quiet "$unit"
        REMOTE
