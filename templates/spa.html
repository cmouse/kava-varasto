{% load vite %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kava-varasto</title>
    {% vite_css "index.html" as css_files %}
    {% for href in css_files %}
    <link rel="stylesheet" href="{{ href }}" />
    {% endfor %}
  </head>
  <body>
    {# Mount point as data, not as an inline script: see frontend/src/utils/scriptName.js #}
    <div id="root" data-script-name="{{ script_name }}"></div>
    <script type="module" src="{% vite_asset 'index.html' %}"></script>
  </body>
</html>
